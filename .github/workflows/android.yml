name: androidloader

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate the wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Cache the Android SDK
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk
            **/build-tools
            **/platforms
          key: sdk-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Install the Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - name: Assemble the debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      # The release build needs a keystore. Without the secrets it is skipped and
      # only the debug APK is published, so a fork can still run the whole workflow.
      - name: Assemble the release APK
        id: release
        env:
          ANDROIDLOADER_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          ANDROIDLOADER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROIDLOADER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROIDLOADER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROIDLOADER_KEYSTORE:-}" ]; then
            echo "No signing secrets configured; building an unsigned release."
            ./gradlew --no-daemon :app:assembleRelease
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The store is passed in base64 so the binary never touches the repo.
          printf '%s' "$ANDROIDLOADER_KEYSTORE" | base64 -d > keystore.jks
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: androidloader-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: androidloader-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish to the releases page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          draft: true
          generate_release_notes: true
